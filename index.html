<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>학술제 심사 평가</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <div class="demo-banner" id="demo-banner" hidden>
    테스트 모드 — 구글 시트가 아직 연결되지 않아 제출 결과가 이 브라우저에만 저장됩니다.
  </div>

  <main class="app">
    <!-- 1. 첫 화면: 심사위원 이름 + 발표 유형 선택 -->
    <section class="start" id="screen-start">
      <div class="start__brand">
        <p class="start__event" data-bind="event-title"></p>
        <h1 class="start__title">심사 평가</h1>
      </div>

      <form class="card start__card" id="start-form" novalidate>
        <label class="field">
          <span class="field__label">심사위원 이름</span>
          <input class="input" id="judge-name" type="text" autocomplete="name" maxlength="30" placeholder="이름을 입력하세요" required>
        </label>

        <div class="field" role="radiogroup" aria-labelledby="type-label">
          <span class="field__label" id="type-label">평가할 발표</span>
          <div class="type-choices" id="type-choices"></div>
        </div>

        <p class="notice" id="start-notice" hidden></p>

        <button class="btn btn-primary btn-block" id="start-btn" type="submit" disabled>평가 시작</button>
      </form>
    </section>

    <!-- 2. 평가 화면 -->
    <section id="screen-eval" hidden>
      <header class="eval-head">
        <div class="eval-head__row">
          <div>
            <h1 class="eval-head__title" id="eval-title"></h1>
            <p class="eval-head__judge" id="eval-judge"></p>
          </div>
          <div class="eval-head__actions">
            <span class="progress-chip" id="progress-text" aria-live="polite"></span>
            <button class="btn btn-ghost btn-sm" type="button" data-action="home">처음으로</button>
          </div>
        </div>
        <div class="progress-bar" aria-hidden="true"><span id="progress-fill"></span></div>
        <nav class="cat-nav" id="cat-nav" aria-label="부문 바로가기"></nav>
      </header>

      <p class="eval-intro muted small">
        항목마다 <b>A(가장 우수) ~ E</b> 중 하나를 고르세요. 불참·이해관계 등으로 평가하지 않을 발표자는
        <b>평가 안 함</b>을 누르면 됩니다. 입력 내용은 이 기기에 자동 저장됩니다.
      </p>
      <p class="notice notice--warn" id="resubmit-notice" hidden>
        제출한 뒤 수정한 내용이 있습니다. <b>다시 제출</b>해야 결과에 반영됩니다.
      </p>

      <div id="eval-list"></div>

      <div class="submit-bar">
        <div class="submit-bar__inner">
          <span class="save-status" id="save-status" aria-live="polite"></span>
          <button class="btn btn-primary" id="submit-btn" type="button">제출하기</button>
        </div>
      </div>
    </section>

    <!-- 3. 제출 완료 -->
    <section class="done" id="screen-done" hidden>
      <div class="card done__card">
        <div class="done__icon" aria-hidden="true">
          <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
        </div>
        <h2 class="done__title">제출이 완료되었습니다</h2>
        <p class="muted" id="done-summary"></p>
        <p class="muted small">수정이 필요하면 언제든 다시 제출할 수 있습니다. 마지막 제출 내용이 반영됩니다.</p>
        <div class="done__actions">
          <button class="btn btn-primary" type="button" id="done-other"></button>
          <button class="btn" type="button" data-action="edit">평가 수정하기</button>
          <button class="btn btn-ghost" type="button" data-action="home">처음 화면으로</button>
        </div>
      </div>
    </section>
  </main>

  <script src="config.js"></script>
  <script src="assets/common.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
