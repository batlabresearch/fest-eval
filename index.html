<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0a1733">
  <title>학술제 심사 평가</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..900&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body class="is-stage">
  <div class="demo-banner" id="demo-banner" hidden>
    테스트 모드 — 제출 결과가 이 브라우저에만 저장되고 구글 시트로는 보내지지 않습니다.
  </div>

  <!-- 1. 첫 화면: 심사위원 이름 + 발표 유형 선택 -->
  <section class="stage" id="screen-start">
    <div class="stage__art" data-hero-art></div>

    <div class="stage__inner">
      <header class="masthead">
        <p class="masthead__tagline" data-bind="hero-tagline"></p>
        <p class="masthead__org">
          <span data-bind="hero-org"></span>
          <span class="masthead__org-en" data-bind="hero-org-en"></span>
        </p>
      </header>

      <div class="title-block">
        <p class="title-block__event" data-bind="event-title"></p>
        <h1 class="title-block__display">
          <span class="title-block__main" data-bind="hero-display"></span>
          <span class="title-block__sub" data-bind="hero-display-sub"></span>
        </h1>
        <p class="title-block__role">심사위원 평가</p>
      </div>

      <form class="entry" id="start-form" novalidate>
        <label class="entry__field">
          <span class="entry__label">심사위원 성명</span>
          <input class="entry__input" id="judge-name" type="text" autocomplete="name" maxlength="30" placeholder="이름 입력" required>
        </label>

        <div class="entry__field" role="radiogroup" aria-labelledby="type-label">
          <span class="entry__label" id="type-label">평가할 발표</span>
          <div class="type-list" id="type-choices"></div>
        </div>

        <p class="entry__notice" id="start-notice" hidden></p>

        <button class="go" id="start-btn" type="submit" disabled>
          <span>평가 시작</span><span class="go__arrow" aria-hidden="true">→</span>
        </button>
      </form>
    </div>
  </section>

  <!-- 2. 평가 화면 (심사표) -->
  <section class="sheet" id="screen-eval" hidden>
    <header class="sheet-head">
      <div class="sheet-head__bar">
        <div class="sheet-head__id">
          <p class="sheet-head__kind" id="eval-title"></p>
          <p class="sheet-head__judge" id="eval-judge"></p>
        </div>
        <p class="sheet-head__count" id="progress-text" aria-live="polite"></p>
        <button class="sheet-head__home" type="button" data-action="home">처음으로</button>
      </div>
      <div class="ticks" id="ticks" aria-hidden="true"></div>
      <nav class="cat-nav" id="cat-nav" aria-label="부문 바로가기"></nav>
    </header>

    <div class="sheet__body">
      <div class="legend">
        <p>항목마다 <b>A</b>(가장 우수)부터 <b>E</b>까지 하나를 고르세요. 불참·이해관계 등으로 평가하지 않을 발표자는 <b>평가 안 함</b>에 표시합니다.</p>
        <p class="legend__note">입력한 내용은 이 기기에 자동 저장됩니다.</p>
      </div>
      <p class="flag" id="resubmit-notice" hidden>
        제출한 뒤 수정한 내용이 있습니다. <b>다시 제출</b>해야 결과에 반영됩니다.
      </p>

      <div id="eval-list"></div>
    </div>

    <div class="submit-bar">
      <div class="submit-bar__inner">
        <span class="save-status" id="save-status" aria-live="polite"></span>
        <button class="go go--compact" id="submit-btn" type="button">
          <span>제출하기</span><span class="go__arrow" aria-hidden="true">→</span>
        </button>
      </div>
    </div>
  </section>

  <!-- 3. 제출 완료 -->
  <section class="stage stage--done" id="screen-done" hidden>
    <div class="stage__art" data-hero-art></div>

    <div class="stage__inner">
      <div class="done">
        <p class="done__kicker">제출 완료</p>
        <h2 class="done__title">평가가 접수되었습니다</h2>

        <dl class="stub" id="done-stub"></dl>

        <p class="done__note">수정이 필요하면 언제든 다시 제출할 수 있습니다. 마지막 제출 내용이 반영됩니다.</p>

        <div class="done__actions">
          <button class="go" type="button" id="done-other"></button>
          <button class="ghost-btn" type="button" data-action="edit">평가 수정하기</button>
          <button class="ghost-btn" type="button" data-action="home">처음 화면으로</button>
        </div>
      </div>
    </div>
  </section>

  <script src="config.js"></script>
  <script src="assets/common.js"></script>
  <script src="assets/hero-art.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
